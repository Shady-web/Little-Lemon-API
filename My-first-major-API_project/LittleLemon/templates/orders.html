{% extends "base.html" %}
{% load static %}

{% block title %}My Orders — Little Lemon{% endblock %}
{% block page_id %}orders{% endblock %}

{% block content %}

<!-- Page header -->
<section class="page-header">
  <div class="page-header-inner">
    <span class="eyebrow">Your History</span>
    <h1>📦 My Orders</h1>
    <p>Track and review all your past orders.</p>
  </div>
</section>

<!-- Orders list -->
<section class="section-pad">
  <div class="container" style="max-width:800px">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px">
      <h2 style="font-size:1.4rem">Order History</h2>
      <a href="/menu/" class="btn btn-green btn-sm">+ New Order</a>
    </div>

    <div id="orders-container">
      <!-- Loaded by JS -->
    </div>

  </div>
</section>

{% endblock %}
